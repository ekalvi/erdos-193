<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" role="img" aria-labelledby="title desc">
  <title id="title">Selected Hilbert points lifted by their indices</title>
  <desc id="desc">Four selected floor points are raised to heights 5, 17, 33, and 51, creating a three-dimensional walk.</desc>
  <rect width="300" height="210" fill="#04060d"/>
  <polygon points="50,165 145,205 250,165 155,125" fill="#0b1220" stroke="#31425f" stroke-width="1.5"/>
  <g stroke="#24334b" stroke-width="1">
    <line x1="80" y1="178" x2="175" y2="138"/><line x1="115" y1="192" x2="210" y2="152"/><line x1="90" y1="148" x2="185" y2="188"/><line x1="125" y1="134" x2="220" y2="174"/>
  </g>
  <g stroke="#60708a" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="204" y1="150" x2="204" y2="136"/><line x1="96" y1="160" x2="96" y2="114"/><line x1="168" y1="180" x2="168" y2="91"/><line x1="204" y1="180" x2="204" y2="42"/>
  </g>
  <polyline points="204,136 96,114 168,91 204,42" fill="none" stroke="#e6a93a" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#3987e5" stroke="#fff" stroke-width="2">
    <circle cx="204" cy="136" r="7"/><circle cx="96" cy="114" r="7"/><circle cx="168" cy="91" r="7"/><circle cx="204" cy="42" r="7"/>
  </g>
  <g fill="#d9e4f5" font-family="ui-sans-serif, sans-serif" font-size="11">
    <text x="211" y="141">5</text><text x="67" y="109">17</text><text x="174" y="87">33</text><text x="211" y="38">51</text>
  </g>
  <line x1="262" y1="180" x2="262" y2="20" stroke="#56b4e9" stroke-width="2"/>
  <path d="M257 29L262 18L267 29" fill="none" stroke="#56b4e9" stroke-width="2"/>
  <text x="228" y="14" fill="#b8c6dd" font-family="ui-sans-serif, sans-serif" font-size="11">height n</text>
</svg>
