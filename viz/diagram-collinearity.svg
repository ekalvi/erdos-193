<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" role="img" aria-labelledby="title desc">
  <title id="title">Three Gaussian-lift points temporarily assumed collinear</title>
  <desc id="desc">Each tagged Gaussian point w_n is lifted to height h_n. The solid arrow labeled X comma A and dashed arrow labeled Y comma B show adjacent displacement vectors; a dotted guide marks the temporary collinearity assumption.</desc>
  <rect width="540" height="280" fill="#04060d"/>
  <defs>
    <marker id="liftArrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#56b4e9"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1baf7a"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e6a93a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, sans-serif">
    <rect x="14" y="10" width="350" height="50" rx="7" fill="#0b1220" stroke="#31425f"/>
    <text x="26" y="28" fill="#8191aa" font-size="10" font-weight="700" letter-spacing="1">THE LIFT RULE</text>
    <text x="26" y="49" fill="#eef4ff" font-size="14" font-weight="600">Pₙ = (Re wₙ, Im wₙ, <tspan fill="#56b4e9">hₙ</tspan>)</text>
    <text x="235" y="48" fill="#56b4e9" font-size="11">tagged Gaussian lift</text>
  </g>
  <polygon points="40,215 230,265 470,215 280,165" fill="#0b1220" stroke="#31425f" stroke-width="1.5"/>
  <g stroke="#24334b" stroke-width="1">
    <line x1="90" y1="228" x2="280" y2="178"/><line x1="165" y1="248" x2="355" y2="198"/><line x1="130" y1="189" x2="320" y2="239"/><line x1="205" y1="169" x2="395" y2="219"/>
  </g>
  <g fill="#0b1220" stroke="#8fa0b9" stroke-width="1.5">
    <circle cx="80" cy="225" r="4"/><circle cx="245" cy="220" r="4"/><circle cx="420" cy="215" r="4"/>
  </g>
  <g stroke="#56b4e9" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#liftArrow)">
    <line x1="80" y1="225" x2="80" y2="184"/><line x1="245" y1="220" x2="245" y2="128"/><line x1="420" y1="215" x2="420" y2="68"/>
  </g>
  <g fill="#56b4e9" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="600">
    <text x="87" y="205">height = hₐ</text><text x="252" y="173">height = hᵦ</text><text x="427" y="142">height = h꜀</text>
  </g>
  <line x1="54" y1="184" x2="446" y2="50" stroke="#e65b58" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
  <line x1="80" y1="175" x2="236" y2="122" stroke="#1baf7a" stroke-width="5" marker-end="url(#greenArrow)"/>
  <line x1="245" y1="119" x2="411" y2="62" stroke="#e6a93a" stroke-width="5" stroke-dasharray="9 5" marker-end="url(#orangeArrow)"/>
  <g fill="#3987e5" stroke="#fff" stroke-width="2">
    <circle cx="80" cy="175" r="8"/><circle cx="245" cy="119" r="8"/><circle cx="420" cy="59" r="8"/>
  </g>
  <g fill="#eef4ff" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600">
    <text x="42" y="158">Pₐ</text><text x="215" y="101">Pᵦ</text><text x="426" y="47">P꜀</text>
  </g>
  <g fill="#c9d6e9" font-family="ui-sans-serif, sans-serif" font-size="13">
    <text x="128" y="132">(X, A)</text><text x="298" y="82">(Y, B)</text><text x="53" y="243">wₐ</text><text x="224" y="239">wᵦ</text><text x="402" y="235">w꜀</text>
  </g>
</svg>
