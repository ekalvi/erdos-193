# Existing production remains independently owned by the reviewed q5m-app/Compose
# release and Cloudflare Tunnel at erdos-193.q5m.ai. This declaration does not
# repoint production to a development server.
version: 2
name: erdos-193
development:
  command: [python3, q5m/serve_site.py]
  health: /index.html
build:
  command: [python3, q5m/build_site.py]
  output: build/q5m-site
