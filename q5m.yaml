# Merge only after homelab rollout/live acceptance and explicit binding adoption.
# YAML production owns releases; the existing Nginx/Compose image, port 8193,
# and erdos-193.q5m.ai tunnel remain. Dev/build are separate entry points.
version: 2
name: erdos-193
development:
  command: [python3, q5m/serve_site.py]
  health: /index.html
build:
  command: [python3, q5m/build_site.py]
  output: build/q5m-site
release:
  adapter: compose
  compose: q5m/compose.yaml
  contract: q5m/app.env
  health: /.q5m-release
production:
  binding: erdos-193
