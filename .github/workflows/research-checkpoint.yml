name: Unit-step research checkpoint

on:
  pull_request:
    paths:
      - 'research/unit-step/**'
      - 'viz/progress.html'
      - 'paper/**'
      - 'design/**'
      - 'results/*unit-step*'
      - 'results/shallit-*'
      - 'q5m.yaml'
      - '.dockerignore'
      - 'README.md'
      - '.github/workflows/research-checkpoint.yml'
  push:
    branches: [main]
    paths:
      - 'research/unit-step/**'
      - 'viz/progress.html'
      - 'paper/**'
      - 'design/**'
      - 'results/*unit-step*'
      - 'results/shallit-*'
      - 'q5m.yaml'
      - '.dockerignore'
      - 'README.md'
      - '.github/workflows/research-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    name: Archive and finite certificates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      UV_THREADPOOL_SIZE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check PDF archive, links, and production separation
        run: node research/unit-step/check.mjs
      - name: Check joint-minimum finite projection examples
        run: node research/unit-step/joint_minimum_examples.mjs
      - name: Check Track A six-step audit diagnostics (finite only)
        run: node research/unit-step/tracks/check_six_step_audit.mjs --recompute
      - name: Verify Shallit fixed-ratio ancestor certificates and resume behavior
        run: |
          node research/unit-step/tracks/shallit-five/check.mjs
          node research/unit-step/tracks/shallit-five/test.mjs
      - name: Check four-letter return reduction and local obstruction certificate
        env:
          UV_THREADPOOL_SIZE: '1'
        run: node research/unit-step/tracks/check_four_letter_returns.mjs
      - name: Check track D projection-obstruction arithmetic
        run: node research/unit-step/tracks/check_d_shallit_projection.mjs
      - name: Check the offline explainer build and finite models
        run: |
          node design/unit-step-explainer/build.mjs
          git diff --exit-code -- design/unit-step-explainer/standalone.html design/unit-step-explainer/public/index.html
          node design/unit-step-explainer/test.mjs
          node design/check_weak_abelian_cube_draft.mjs
      - name: Independently validate dimension certificates and C++ resume behavior
        shell: bash
        run: |
          set -euo pipefail
          src=design/verify_unit_step_prefix.cpp
          g++ -O2 -std=c++17 -Wall -Wextra -pedantic \
            -DSOURCE_SHA=\"$(sha256sum "$src" | cut -d' ' -f1)\" \
            "$src" -o /tmp/verify_unit_step_prefix
          python3 design/check_unit_step_dimension_results.py --binary /tmp/verify_unit_step_prefix
      - name: Check signed-family selector reductions and overlap exclusions
        run: |
          node --test --test-concurrency=1 research/unit-step/tracks/*.test.mjs
          node research/unit-step/tracks/check_signed_phase_selector.mjs
          node research/unit-step/tracks/signed_phase_overlap.mjs --q 3 --seconds 60 \
            --output research/unit-step/checks/signed-phase-overlap-8.json
          node research/unit-step/tracks/check_signed_phase_overlap.mjs --q 3 --write
          git diff --exit-code -- \
            research/unit-step/checks/signed-phase-overlap-8.json \
            research/unit-step/checks/signed-phase-reference-8.json
